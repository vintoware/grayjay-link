name: Release

# A push to main whose head commit is a release commit ("chore(release): X.Y.Z",
# created by tools/release.py prepare) tags that commit vX.Y.Z, publishes the
# GitHub release with its CHANGELOG.md section, and hands the new version to the
# vintoware-rpm repository.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: "startsWith(github.event.head_commit.message, 'chore(release): ')"
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # tag + GitHub release
      id-token: write   # keyless cosign signature
    outputs:
      version: ${{ steps.version.outputs.version }}
      extension_changed: ${{ steps.version.outputs.extension_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read version
        id: version
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(printf '%s\n' "$MESSAGE" | head -n 1 | sed -nE 's/^chore\(release\): ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
          [ -n "$version" ] || { echo "::error::not a release commit: $(printf '%s' "$MESSAGE" | head -n 1)"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists"; exit 1
          fi
          python tools/release.py check "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # tools/release.py sets the extension's version to the release version
          # only when something under firefox/ changed since the previous release.
          ext=$(python -c 'import json; print(json.load(open("firefox/manifest.json"))["version"])')
          if [ "$ext" = "$version" ]; then changed=true; else changed=false; fi
          echo "Firefox extension $ext (changed in this release: $changed)"
          echo "extension_changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: python -m unittest

      - name: Build release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXTENSION_CHANGED: ${{ steps.version.outputs.extension_changed }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="grayjay-link-$VERSION/" -o "dist/grayjay-link-$VERSION.tar.gz" HEAD
          (cd plasmoid && zip -qrX "../dist/grayjay-link-$VERSION.plasmoid" .)
          if [ "$EXTENSION_CHANGED" = true ]; then tools/package-firefox.sh; fi
          python tools/release.py notes "$VERSION" > notes.md
          (cd dist && sha256sum -- * > checksums.txt && cat checksums.txt)

      # Same pinned cosign as vintoware-rpm, checked against sigstore/cosign's
      # cosign_checksums.txt for that release.
      - name: Install cosign
        env:
          COSIGN_VERSION: v3.1.4
          COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        run: |
          curl -fsSL -o /usr/local/bin/cosign \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  /usr/local/bin/cosign" | sha256sum -c -
          chmod +x /usr/local/bin/cosign

      - name: Sign checksums (Sigstore keyless)
        run: |
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          cosign verify-blob --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            dist/checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "grayjay-link $VERSION" \
            --notes-file notes.md dist/*

  firefox:
    # When firefox/ changed in this release: signs the extension on
    # addons.mozilla.org as an unlisted (self-distributed) add-on and attaches the
    # signed .xpi plus updates.json to the release. Otherwise nothing is submitted
    # to AMO and the previous updates.json is carried over. Installed copies find
    # new versions through the manifest's update_url, which points at
    # updates.json on the latest release, so every release must have one.
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      HAS_AMO_KEYS: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
      VERSION: ${{ needs.release.outputs.version }}
      EXTENSION_CHANGED: ${{ needs.release.outputs.extension_changed }}
      SIGN: ${{ needs.release.outputs.extension_changed == 'true' && secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    steps:
      - name: Check for AMO credentials
        if: env.EXTENSION_CHANGED == 'true' && env.HAS_AMO_KEYS != 'true'
        run: |
          echo "::warning::AMO_JWT_ISSUER / AMO_JWT_SECRET are not set; the Firefox extension was not signed. Upload grayjay-link-firefox-$VERSION.zip to addons.mozilla.org by hand."

      - uses: actions/checkout@v4
        with:
          ref: v${{ env.VERSION }}

      - name: Carry over updates.json (extension unchanged)
        if: env.EXTENSION_CHANGED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ext=$(python3 -c 'import json; print(json.load(open("firefox/manifest.json"))["version"])')
          echo "Firefox extension unchanged at $ext; not submitting to addons.mozilla.org."
          for tag in $(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName'); do
            [ "$tag" = "v$VERSION" ] && continue
            if gh release download "$tag" --pattern updates.json --dir carried --clobber 2>/dev/null; then
              listed=$(python3 -c 'import json,sys; d=json.load(open("carried/updates.json")); print(next(iter(d["addons"].values()))["updates"][-1]["version"])')
              if [ "$listed" != "$ext" ]; then
                echo "::error::updates.json from $tag lists $listed, but the extension is $ext"; exit 1
              fi
              echo "Carrying over updates.json from $tag (extension $ext)"
              gh release upload "v$VERSION" carried/updates.json --clobber
              exit 0
            fi
          done
          echo "::warning::no earlier release has updates.json; installed extensions won't see updates until one does"

      - uses: actions/setup-node@v4
        if: env.SIGN == 'true'
        with:
          node-version: lts/*

      - name: Sign on addons.mozilla.org (unlisted)
        if: env.SIGN == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@10.8.0 sign --channel=unlisted --source-dir firefox \
            --artifacts-dir signed --approval-timeout 1800000
          ls -l signed

      - name: Attach the signed XPI and updates.json
        if: env.SIGN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- signed/*.xpi
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::expected one signed .xpi, got: $*"; exit 1; }
          xpi="grayjay-link-firefox-$VERSION.xpi"
          mv "$1" "$xpi"
          python3 - "$VERSION" "$xpi" "$GITHUB_REPOSITORY" > updates.json <<'PY'
          import hashlib, json, sys
          version, xpi, repo = sys.argv[1:4]
          addon_id = json.load(open("firefox/manifest.json"))["browser_specific_settings"]["gecko"]["id"]
          sha256 = hashlib.sha256(open(xpi, "rb").read()).hexdigest()
          json.dump({"addons": {addon_id: {"updates": [{
              "version": version,
              "update_link": f"https://github.com/{repo}/releases/download/v{version}/{xpi}",
              "update_hash": f"sha256:{sha256}",
          }]}}}, sys.stdout, indent=2)
          PY
          cat updates.json
          gh release upload "v$VERSION" "$xpi" updates.json --clobber

  rpm:
    # Runs vintoware-rpm's own update hook (which verifies the signed checksums
    # against this workflow and commit) and pushes the spec bump; that push
    # starts vintoware-rpm's build-and-publish workflow. If this job fails, the
    # repository's 3-hourly check picks the release up anyway.
    needs: release
    runs-on: ubuntu-24.04
    env:
      HAS_DEPLOY_KEY: ${{ secrets.RPM_REPO_DEPLOY_KEY != '' }}
    steps:
      - name: Check for the deploy key
        if: env.HAS_DEPLOY_KEY != 'true'
        run: |
          echo "::warning::RPM_REPO_DEPLOY_KEY is not set; skipping the immediate RPM trigger. vintoware-rpm's scheduled check will pick up this release within 3 hours."

      - name: Install cosign
        if: env.HAS_DEPLOY_KEY == 'true'
        env:
          COSIGN_VERSION: v3.1.4
          COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        run: |
          curl -fsSL -o /usr/local/bin/cosign \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  /usr/local/bin/cosign" | sha256sum -c -
          chmod +x /usr/local/bin/cosign

      - uses: actions/checkout@v4
        if: env.HAS_DEPLOY_KEY == 'true'
        with:
          repository: vintoware/vintoware-rpm
          ssh-key: ${{ secrets.RPM_REPO_DEPLOY_KEY }}
          path: rpm

      - name: Bump packages/grayjay-link and push
        if: env.HAS_DEPLOY_KEY == 'true'
        working-directory: rpm
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          hook=packages/grayjay-link/update
          if [ ! -x "$hook" ]; then
            echo "::warning::$hook not found in vintoware-rpm; nothing to trigger"; exit 0
          fi
          git config user.name "grayjay-link release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            "$hook"
            if git diff --quiet; then
              echo "packages/grayjay-link is already at $VERSION"; exit 0
            fi
            git commit -qam "Update grayjay-link to $VERSION"
            if git push origin HEAD:main; then exit 0; fi
            echo "push raced with another commit; retrying ($attempt)"; sleep 5
          done
          exit 1
